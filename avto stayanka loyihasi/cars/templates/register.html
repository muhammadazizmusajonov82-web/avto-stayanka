{% extends 'base.html' %}
{% block title %}Admin Registratsiya{% endblock %}
{% block content %}
<div class="auth-center">
    <div class="auth-card">
        <h2>Admin Registratsiya</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-unified w-100">Ro'yxatdan o'tish</button>
        </form>
        <p class="login-text mt-3">Akkountingiz bormi? <a href="{% url 'login' %}">Kirish</a></p>
    </div>
</div>
{% endblock %}
